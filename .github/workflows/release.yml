name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (must follow semver starting with v, e.g. v1.0.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: resolve-tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = ""
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = "$($env:INPUT_TAG)".Trim()
          } else {
            $tag = "$($env:REF_NAME)".Trim()
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid release tag '$tag'. Tag must follow exact semantic versioning 'vMAJOR.MINOR.PATCH' (e.g. v1.0.4)."
            exit 1
          }
          git rev-parse --verify "refs/tags/$tag^{commit}" *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release tag '$tag' does not exist in repository refs."
            exit 1
          }
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            git checkout --force "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tagSha = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          $headSha = (git rev-parse HEAD).Trim()
          if ($tagSha -ne $headSha) {
            Write-Error "HEAD ($headSha) does not match tag '$tag' commit ($tagSha)."
            exit 1
          }
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedVersion = $tag.Substring(1)
          if ($pkgVersion -ne $expectedVersion) {
            Write-Error "package.json version ($pkgVersion) does not match tag '$tag' ($expectedVersion)."
            exit 1
          }
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          $versionSlug = ($tag -replace '\.', '-')
          $buildTag = "$(Get-Date -Format 'yyyyMMdd')-$versionSlug-$shortSha"
          Write-Host "Validated release tag: $tag ($headSha), buildTag: $buildTag"
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_commit=$headSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_tag=$buildTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js 22.17.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'

      - name: Run test suite
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release content and bank integrity
        shell: pwsh
        run: |
          npm run verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package and single-file EXE
        shell: pwsh
        env:
          PORTABLE_DATE: ${{ steps.resolve-tag.outputs.build_tag }}
        run: |
          node scripts/build-portable.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/portable/verify-portable.mjs "dist/portable/RuankaoExam-Portable-$($env:PORTABLE_DATE)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Checksums
        shell: pwsh
        env:
          BUILD_TAG: ${{ steps.resolve-tag.outputs.build_tag }}
        run: |
          $zipPath = "dist/portable/RuankaoExam-Portable-$($env:BUILD_TAG).zip"
          $exePath = "dist/portable/RuankaoExam-SingleExe-$($env:BUILD_TAG).exe"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            Write-Error "Portable ZIP archive was not produced at $zipPath!"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $exePath)) {
            Write-Error "Single-File EXE was not produced at $exePath!"
            exit 1
          }
          $artifacts = @((Resolve-Path -LiteralPath $zipPath).Path, (Resolve-Path -LiteralPath $exePath).Path)
          Get-FileHash $artifacts -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File -FilePath dist/portable/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/portable/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.release_tag }}
          name: 软件设计师刷题与智能复习工作台 ${{ steps.resolve-tag.outputs.release_tag }}
          target_commitish: ${{ steps.resolve-tag.outputs.release_commit }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/portable/RuankaoExam-Portable-${{ steps.resolve-tag.outputs.build_tag }}.zip
            dist/portable/RuankaoExam-SingleExe-${{ steps.resolve-tag.outputs.build_tag }}.exe
            dist/portable/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
